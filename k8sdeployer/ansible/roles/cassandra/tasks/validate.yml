---
- name: Check pods status
  k8s_info:
    context: "{{ context | default(omit) }}"
    host: "{{ server if (token | default('') | string | length) > 0 else omit }}"
    api_key: "{{ token if (token | default('') | string | length) > 0 else omit }}"
    verify_ssl: "{{ verify_ssl }}"
    kind: Pod
    namespace: "{{ namespace }}"
    label_selectors:
      - app={{ app_name }}
    field_selectors:
      - status.phase=Running
  register: pod
  until: >-
    pod.resources|default([])|length == number_of_replicas and
    pod | json_query('resources[*].status.containerStatuses[*].ready') | flatten |difference( [true] ) | length  == 0
  retries: 30
  delay: 10
  ignore_errors: yes
  no_log: true

- name: Print Pod Status.Phase
  debug:
    msg: "Pod Name: {{ item.metadata.name }} | Status: {{ item.status.phase }}"
  loop: "{{ pod.resources }}"
  when: pod.failed == true

- name: Fail if pod count is not matching
  fail:
    msg: "Pod count should be {{ number_of_replicas }} but got {{ pod.resources | length }}"
  when: pod.resources|length != number_of_replicas

- name: Fail if any pod is not ready
  fail:
    msg: "Pod Name: {{ item.metadata.name }} | Ready Status: {{ item.status.containerStatuses[0].ready }}"
  loop: "{{ pod.resources }}"
  when: pod.failed == true

- name: Get pod name
  set_fact:
    pod_name: "{{ (pod.resources|first).metadata.name }}"

- name: Wait until all cassandra node are ready (Status=Up and State=Normal)
  kubernetes.core.k8s_exec:
    context: "{{ context | default(omit) }}"
    host: "{{ server if (token | default('') | string | length) > 0 else omit }}"
    api_key: "{{ token if (token | default('') | string | length) > 0 else omit }}"
    verify_ssl: "{{ verify_ssl }}"
    namespace: "{{ namespace }}"
    pod: "{{ pod_name }}"
    container: "{{ app_name }}"
    command: nodetool status
  register: result
  until: result.rc == 0 and (result.stdout | regex_findall('(?m)^UN\\s+') | length) == (number_of_replicas | int)
  retries: 30
  delay: 10
  ignore_errors: yes

- name: Scale down the StatefulSet if node ready phase failed
  k8s:
    context: "{{ context | default(omit) }}"
    host: "{{ server if (token | default('') | string | length) > 0 else omit }}"
    api_key: "{{ token if (token | default('') | string | length) > 0 else omit }}"
    verify_ssl: "{{ verify_ssl }}"
    kind: StatefulSet
    namespace: "{{ namespace }}"
    name: "{{ app_name }}"
    replicas: 0
  when: result.failed == true
  register: scale_down_result

- name: Wait for the StatefulSet to scale down
  k8s_info:
    context: "{{ context | default(omit) }}"
    host: "{{ server if (token | default('') | string | length) > 0 else omit }}"
    api_key: "{{ token if (token | default('') | string | length) > 0 else omit }}"
    verify_ssl: "{{ verify_ssl }}"
    kind: StatefulSet
    namespace: "{{ namespace }}"
    name: "{{ app_name }}"
  register: statefulset_info
  until: statefulset_info.resources[0].status.replicas == 0
  retries: 30
  delay: 10
  when: result.failed == true

- name: Scale up the StatefulSet after scaling down
  k8s:
    context: "{{ context | default(omit) }}"
    host: "{{ server if (token | default('') | string | length) > 0 else omit }}"
    api_key: "{{ token if (token | default('') | string | length) > 0 else omit }}"
    verify_ssl: "{{ verify_ssl }}"
    kind: StatefulSet
    namespace: "{{ namespace }}"
    name: "{{ app_name }}"
    replicas: "{{ number_of_replicas }}"
  when: scale_down_result is succeeded and result.failed == true

- name: Check pods status after scale up
  k8s_info:
    context: "{{ context | default(omit) }}"
    host: "{{ server if (token | default('') | string | length) > 0 else omit }}"
    api_key: "{{ token if (token | default('') | string | length) > 0 else omit }}"
    verify_ssl: "{{ verify_ssl }}"
    kind: Pod
    namespace: "{{ namespace }}"
    label_selectors:
      - app={{ app_name }}
    field_selectors:
      - status.phase=Running
  register: pod
  until: >-
    pod.resources|default([])|length == number_of_replicas and
    pod | json_query('resources[*].status.containerStatuses[*].ready') | flatten |difference( [true] ) | length  == 0
  retries: 30
  delay: 10
  when: result.failed == true

- name: Wait until all cassandra node are ready (Status=Up and State=Normal) after scale up
  kubernetes.core.k8s_exec:
    context: "{{ context | default(omit) }}"
    host: "{{ server if (token | default('') | string | length) > 0 else omit }}"
    api_key: "{{ token if (token | default('') | string | length) > 0 else omit }}"
    verify_ssl: "{{ verify_ssl }}"
    namespace: "{{ namespace }}"
    pod: "{{ pod_name }}"
    container: "{{ app_name }}"
    command: nodetool status
  register: node_ready
  until: node_ready.rc == 0 and (node_ready.stdout | regex_findall('(?m)^UN\\s+') | length) == (number_of_replicas | int)
  retries: 30
  delay: 10
  when: result.failed == true

- name: Verify Data was populated
  kubernetes.core.k8s_exec:
    context: "{{ context | default(omit) }}"
    host: "{{ server if (token | default('') | string | length) > 0 else omit }}"
    api_key: "{{ token if (token | default('') | string | length) > 0 else omit }}"
    verify_ssl: "{{ verify_ssl }}"
    namespace: "{{ namespace }}"
    pod: "{{ pod_name }}"
    container: "{{ app_name }}"
    command: /bin/sh -c "HOME=/tmp cqlsh --no-color -e 'SELECT * FROM classicmodels.offices;'"
  register: result
  until: result.rc == 0
  retries: 5

- name: Save actual output
  copy:
    content: "{{ result.stdout }}"
    dest: "{{ role_path }}/files/actual_output"
  delegate_to: localhost

- name: Verify Data Integrity
  shell: "diff -w {{ role_path }}/files/expected_output {{ role_path }}/files/actual_output"
  register: result
  until: result.rc == 0
  retries: 5
  delegate_to: localhost
