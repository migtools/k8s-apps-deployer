---
- name: Delete PostgreSQL StatefulSet
  k8s:
    state: absent
    definition:
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: "{{ app_name }}"
        namespace: "{{ namespace }}"
    host: "{{ server }}"
    api_key: "{{ token }}"
    verify_ssl: "{{ verify_ssl }}"
- name: Delete application resources
  k8s:
    state: absent
    definition:
      apiVersion: v1
      kind: "{{ item.kind }}"
      metadata:
        name: "{{ item.name }}"
        namespace: "{{ namespace }}"
    host: "{{ server }}"
    api_key: "{{ token }}"
    verify_ssl: "{{ verify_ssl }}"
  loop:
    - kind: Service
      name: "{{ app_name }}"
    - kind: Secret
      name: "{{ app_name }}"
    - kind: PersistentVolumeClaim
      name: "data-{{ app_name }}-0"
    - kind: ServiceAccount
      name: "{{ service_account_name }}"
