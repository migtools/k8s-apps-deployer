---
- name: Wait for MySQL pod to be ready
  k8s_info:
    kind: Pod
    namespace: "{{ namespace }}"
    label_selectors:
      - app={{ app_name }}
    field_selectors:
      - status.phase=Running
    host: "{{ server }}"
    api_key: "{{ token }}"
    verify_ssl: "{{ verify_ssl }}"
  register: pod
  until: >-
    pod.resources | length == 1 and
    pod.resources[0].status.containerStatuses[0].ready | default(false)
  retries: 30
  delay: 10
- name: Get MySQL pod name
  set_fact:
    pod_name: "{{ (pod.resources | first).metadata.name }}"
- name: Verify migrated orders data
  kubernetes.core.k8s_exec:
    host: "{{ server }}"
    api_key: "{{ token }}"
    verify_ssl: "{{ verify_ssl }}"
    namespace: "{{ namespace }}"
    pod: "{{ pod_name }}"
    container: mysql
    command: >-
      /bin/sh -ec "mysql -N -uroot {{ database_name }} -e
      \"SELECT COUNT(*), MD5(GROUP_CONCAT(CONCAT(order_id, ':', customer, ':', amount_cents, ':', status)
      ORDER BY order_id SEPARATOR ',')) FROM orders WHERE order_id IN ('order-1001', 'order-1002', 'order-1003');\""
  register: orders_result
  changed_when: false
- name: Assert expected orders data exists
  assert:
    that:
      - orders_result.rc == 0
      - orders_result.stdout | trim == '3\t8fb16c39faf6e3b2b3ab00c1af2c0798'
- name: Verify application can write and read data
  kubernetes.core.k8s_exec:
    host: "{{ server }}"
    api_key: "{{ token }}"
    verify_ssl: "{{ verify_ssl }}"
    namespace: "{{ namespace }}"
    pod: "{{ pod_name }}"
    container: mysql
    command: >-
      /bin/sh -ec "mysql -N -uroot {{ database_name }} -e
      \"INSERT INTO orders (order_id, customer, amount_cents, status) VALUES ('order-validation',
      'migration-check', 1, 'validated') ON DUPLICATE KEY UPDATE status=VALUES(status); SELECT status
      FROM orders WHERE order_id='order-validation';\""
  register: write_read_result
  changed_when: false
- name: Assert application write and read succeeded
  assert:
    that:
      - write_read_result.rc == 0
      - write_read_result.stdout | trim == 'validated'
